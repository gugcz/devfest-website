# Version updates for the three ecosystems this repo depends on. Security
# updates are on regardless of this file; this adds routine bumps, grouped so
# a week's worth of patch/minor churn is one PR per ecosystem.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
    groups:
      functions-minor-patch:
        update-types: [minor, patch]
