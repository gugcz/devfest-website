# Version updates for the three ecosystems this repo depends on. Security
# updates are on regardless of this file; this adds routine bumps, grouped so
# a week's worth of patch/minor churn is one PR per ecosystem.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # TypeScript 7 is the native (Go) compiler: no `lib/typescript.js`, only
    # `unstable/*` wrappers. `@astrojs/check` (Volar) needs the JS API and
    # peer-pins `typescript@^5 || ^6`. Drop once a @astrojs/check release
    # accepts ^7. `functions/` is plain tsc and already on 7.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
    groups:
      functions-minor-patch:
        update-types: [minor, patch]
