# Deploys the production Hosting site on every push to the release branch, and
# once a day regardless.
#
# The daily run is not busywork: `/speakers`, `/sessions` and `/agenda` bake the
# lineup and its JSON-LD into their HTML at build time (see
# src/lib/lineup-build.ts), while `refreshSessionizeScheduled` updates Firestore
# every morning at 06:00 Prague. Without a rebuild, a withdrawn speaker or a
# moved room stays in the published structured data until somebody happens to
# merge something. The build is deterministic apart from that lineup read, so a
# scheduled run redeploys the same commit with fresh data.
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - "2026"
  schedule:
    # 07:00 UTC — after the 06:00 Europe/Prague Sessionize sync in either DST
    # state, so the rebuild always picks up that morning's lineup.
    - cron: "0 7 * * *"
  workflow_dispatch:
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Deploy with w9jds/firebase-action, which runs firebase-tools inside a
      # Node 21 container. This avoids the intermittent "Premature close"
      # keep-alive failure that breaks FirebaseExtended/action-hosting-deploy
      # when it runs firebase-tools on the runner's security-patched Node.
      - name: Deploy to Firebase Hosting (live)
        uses: w9jds/firebase-action@v15.22.3
        with:
          args: deploy --only hosting --project devfest-cz-app
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEVFEST_CZ_APP }}
