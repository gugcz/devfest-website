# Deploys the production Hosting site on every push to the release branch.
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - "2026"
    # Everything except what never reaches the built site (docs, agent config,
    # functions, other workflows) — those skip the rebuild + redeploy.
    paths:
      - "**"
      - "!**.md"
      - "!.claude/**"
      - "!functions/**"
      - "!.github/**"
      - ".github/workflows/firebase-hosting-merge.yml"
permissions:
  contents: read
# Production deploys queue rather than race: two quick merges must land in
# order, and never in parallel.
concurrency:
  group: deploy-hosting-prod
  cancel-in-progress: false
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_INVITE_DISCOUNT_URL: ${{ secrets.PUBLIC_INVITE_DISCOUNT_URL }}
      # Deploy with w9jds/firebase-action, which runs firebase-tools inside a
      # Node 21 container. This avoids the intermittent "Premature close"
      # keep-alive failure that breaks FirebaseExtended/action-hosting-deploy
      # when it runs firebase-tools on the runner's security-patched Node.
      - name: Deploy to Firebase Hosting (live)
        uses: w9jds/firebase-action@v15.30.0
        with:
          args: deploy --only hosting --project devfest-cz-app
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEVFEST_CZ_APP }}
