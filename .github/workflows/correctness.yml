name: Correctness gate

# Every PR, no path filter: the `2026` ruleset requires these checks.
on:
  pull_request:
  push:
    branches: [2026]

permissions:
  contents: read

# A newer push to the same PR supersedes the running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # One job, one `npm ci`: the checks themselves take seconds, the install
  # is what each extra job would pay again.
  site-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - id: install
        run: npm ci

      # Each check runs even when the one before it failed, so one red run
      # names every failing check.
      - name: astro check
        run: npm run check

      - name: Cognitive complexity
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run complexity

      - name: No event, organizer or origin literal outside the site config
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run literals

      - name: Site tests (src/**/*.test.ts)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:site

  functions-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Run functions test suite
        working-directory: functions
        run: npm test
