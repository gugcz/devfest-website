# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEVFEST_CZ_APP }}
          projectId: devfest-cz-app
          expires: 3d
          # Pin firebase-tools: 15.x (`latest`) intermittently retries the
          # release POST after a "premature close" on the googleapis
          # connection and then fails with 400 FAILED_PRECONDITION "supplied
          # version is the current active version" even though the deploy
          # already landed. 13.35.1 is the Firebase-recommended known-good
          # pin. Revisit once upstream fixes the non-idempotent retry.
          # https://github.com/firebase/firebase-tools/issues/8386
          firebaseToolsVersion: "13.35.1"
