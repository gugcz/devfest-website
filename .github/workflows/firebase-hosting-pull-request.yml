# Deploys each PR to its own Firebase Hosting preview channel.
name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  contents: read
# One preview deploy per PR at a time; a newer push supersedes the running one.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same-repo PRs only (above), yet the deploy step below runs with a
    # service-account key and `firebase.json` is under the PR's control (a
    # `predeploy` entry is arbitrary shell). Keep the preview credential a
    # separate, Hosting-only account — or better, Workload Identity — and
    # never the production one. Settings → Environments → preview.
    environment: preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_INVITE_DISCOUNT_URL: ${{ secrets.PUBLIC_INVITE_DISCOUNT_URL }}
      # Deploy to a per-PR preview channel with w9jds/firebase-action, which
      # runs firebase-tools inside a Node 21 container. This avoids the
      # intermittent "Premature close" keep-alive failure that breaks
      # FirebaseExtended/action-hosting-deploy on the runner's patched Node.
      # The channel id is stable per PR, so re-pushes update it in place; it
      # auto-expires after 7 days. The preview URL is printed in this step's
      # logs (action-hosting-deploy's auto PR comment is not reproduced here).
      #
      # HOSTING ONLY — this deploys static content, never the Cloud Functions.
      # The /api/* rewrites in firebase.json intentionally carry NO `pinTag`, so a
      # channel deploy does not build/deploy lineupApi/ticketsApi (that would run
      # the functions predeploy `tsc` — not installed here — and could push PR
      # function code toward production). Preview /api/* calls hit the already-
      # deployed PRODUCTION functions; before their first prod deploy they 404 and
      # the islands show their "unavailable" state. Functions deploy only via
      # firebase-functions-merge.yml. To verify SSR-function CHANGES, run locally.
      - name: Deploy to Firebase Hosting (preview channel)
        uses: w9jds/firebase-action@f527de56a76155c20044753433bc6b5b379f4641 # v15.30.0
        with:
          args: hosting:channel:deploy pr-${{ github.event.pull_request.number }} --project devfest-cz-app --expires 7d
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEVFEST_CZ_APP }}
