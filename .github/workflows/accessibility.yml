name: Accessibility audit

# Runs on every PR, unfiltered: the `2026` ruleset requires `axe`, and a
# path-filtered check never reports on a docs-only PR, leaving it unmergeable.
on:
  pull_request:
  push:
    branches: [2026]

permissions:
  contents: read

# A newer push to the same PR supersedes the running audit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  axe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # `npm run a11y` builds with A11Y_MOCK=1 (fixture-hydrated lineup + tickets,
      # see scripts/a11y-mocks/) so the gated ready-state content is audited, then
      # runs the axe sweep over the built site.
      - name: Run axe-core audit
        run: npm run a11y
