name: Accessibility audit

# Every PR, no path filter: the `2026` ruleset requires this check.
on:
  pull_request:
  push:
    branches: [2026]

permissions:
  contents: read

# A newer push to the same PR supersedes the running audit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  axe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # `npm run a11y` builds with A11Y_MOCK=1 (fixture-hydrated lineup + tickets,
      # see scripts/a11y-mocks/) so the gated ready-state content is audited, then
      # runs the axe sweep over the built site.
      - name: Run axe-core audit
        run: npm run a11y
