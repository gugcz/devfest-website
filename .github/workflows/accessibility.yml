name: Accessibility audit

# Every PR, no path filter: the `2026` ruleset requires this check.
on:
  pull_request:
  push:
    branches: [2026]

permissions:
  contents: read

# A newer push to the same PR supersedes the running audit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  axe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Chromium and its system libraries ship in the image, so nothing is
    # downloaded or apt-installed per run. The tag must equal the `playwright`
    # version in package-lock.json; the first step fails loudly when it drifts.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Playwright matches the container image
        run: |
          installed=$(node -p "require('playwright/package.json').version")
          if [ "$installed" != "1.64.1" ]; then
            echo "::error::playwright is $installed, the container image is v1.64.1. Bump the image tag in this workflow."
            exit 1
          fi

      # `npm run a11y` builds with A11Y_MOCK=1 (fixture-hydrated lineup + tickets,
      # see scripts/a11y-mocks/) so the gated ready-state content is audited, then
      # runs the axe sweep over the built site.
      - name: Run axe-core audit
        run: npm run a11y
